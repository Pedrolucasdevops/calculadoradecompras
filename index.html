<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Compras</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>
    <div class="container">
        <h1>Calculadora de Compras</h1>

        <div class="form-group">
            <input type="text" id="nomeProduto" placeholder="Nome do produto">
            <input type="number" id="qtdProduto" placeholder="Qtd" min="1" value="1">
            <input type="number" id="precoProduto" placeholder="Preço (R$)" step="0.01">
            <button onclick="adicionarItem()">Adicionar</button>
        </div>

        <div class="lista-compras">
            <h2>Itens no carrinho:</h2>
            <ul id="listaItens"></ul>
        </div>

        <div class="total-container">
            <h3>Total: R$ <span id="valorTotal">0,00</span></h3>
            <button class="btn-limpar" onclick="limparLista()">Limpar Lista</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
